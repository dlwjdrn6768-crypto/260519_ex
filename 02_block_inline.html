<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Inline</title>
    <style>
      div {
        background-color: salmon;
        width: 150px;
        height: 50px;
        margin: 15px;
        padding: 15px;
        /* display: block; */
      }
      span {
        /* display: inline; */
        background-color: greenyellow;
        width: 150px;
        height: 50px;
        margin: 15px;
        padding: 15px;
      }
      .block{
        display: block;
      }
      .inline{
        display: inline;
      }
      .inlie-block{
        display: inline-block; 
      }
      .container{
        width: 100%;
        height: 100%;
        background-color: transparent;
        
      }
    </style>
  </head>
  <body>
    <div>b1</div>
    <div>b2</div>
    <span>i1</span>
    <span>i2</span>
    <div class="inline">a1</div>
    <span class="block">a2</span>
    <div class="inlie-block">a3</div>
    <div class="inlie-block">a4</div>
    <img src="https://picsum.photos/100/50"/>
    <img src="https://picsum.photos/100/50"/>
    <div style="display: none;">b1</div>
    <div>b2</div>
    <div style="visibility: hidden;">c1</div>
    <div>c2</div>
    <hr/>
    <div class="container">
      <div class="container">header : 맨 위에 사이트에 대한 설명 등</div>
    </div>
    <section>
      <!-- component라고 재사용되며 디자인/기능적으로 하나로 묶음인 요소 => div-->
      <!-- 화면구성/레이아웃에서는 일반적으로 section -->
      <header>반갑습니다 정구의 포폴</header>
    </section>
    <br/>
    <br/>
    <br/>
    <br/>
    <br/>
    <br/>
    <br/>
    <br/>
    <br/>

  </body>
</html>
